{% extends "base.html" %}
{% block title %}Исполнители{% endblock title %}
{% block content %}
    <table>
        <thead>
            <tr>
                <th> Номер </th>
                <th> Название </th>
                <th> Фото </th>
                <th>  </th>
                <th>  </th>
            </tr>
        </thead>
        <tbody>
          {% for a in artists %}
                <tr>
                    <td>{{a.id}}</td>
                    <td>{{a.name_ru}}</td>
                    <td><img class="artists_logo" src="/media/{{a.image}}" alt=""></td>
                    <td><a href="/editartist/{{a.id}}">Редактировать </a></td>
                    <td><a href="/deleteartists/{{a.id}}">Удалить </a></td>
                    

                </tr>
         {% endfor %}
        </tbody>
    </table>
    <a href="/add_artists">Добавить исполнителя</a>
{% endblock content %}
